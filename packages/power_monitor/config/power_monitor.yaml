ina3221_node:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 64
    # A0 接點或上電時序異常時，依晶片識別碼自動探測 INA3221。
    auto_detect_i2c_address: true
    i2c_probe_addresses: [64, 65, 66, 67]
    i2c_reprobe_interval_sec: 2.0
    i2c_reprobe_after_failures: 2
    i2c_error_log_period_sec: 5.0
    current_lsb: 0.0004
    bus_voltage_lsb: 0.008
    # 3 samples keep useful noise rejection while cutting physical-action latency.
    window_size: 3
    sample_period: 0.5
    # bus voltage 是 3S 車輛母線，不能用來判斷槽位是否有行充。
    empty_voltage_max_v: 1.0
    # 2026-08 實測：正常快充模組空載 0.003–0.005 A。
    empty_current_max_a: 0.008
    # 0.008–0.020 A 是遲滯區，維持上一個可信狀態。
    present_current_min_a: 0.020
    # Type-C 快充輸入功率模型：<=5 W 為 full、5–10 W 為 ready、>10 W 為 low/charging。
    full_power_max_w: 5.0
    ready_power_max_w: 10.0
    # 避免功率在門檻附近波動時反覆切換狀態。
    power_hysteresis_w: 0.5
    # 0.5 秒取樣，連續 3 筆（約 1.5 秒）才確認狀態切換。
    state_confirm_samples: 3
    # Keep state changes and a low-rate summary; raw values remain on ROS topics.
    summary_log_period_sec: 10.0
    # 2026-09-22 measured immediately after charging: 12.360–12.368 V.
    vehicle_full_voltage_v: 12.368
    vehicle_low_voltage_v: 10.5
    vehicle_reserve_voltage_v: 10.2
    vehicle_critical_voltage_v: 9.8
    vehicle_cutoff_voltage_v: 9.5
    # 三個快充槽皆已接上可用模組。
    slot_enabled: [true, true, true]
