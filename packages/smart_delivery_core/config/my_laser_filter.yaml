scan_to_scan_filter_chain:
  ros__parameters:
    filter_threads: 1       # 🌟 確保過濾器使用獨立執行緒，避免卡頓
    filters: ["filter1"]    # 🌟 致命關鍵！告訴系統：「請幫我載入並執行 filter1」
    filter1:
      name: self_mask_box
      type: laser_filters/LaserScanBoxFilter
      params:
        # 以 base_footprint 表達車體遮罩，避免雷達反裝 180 度造成前後左右顛倒。
        # 雷達中心位於車體 (0.15, -0.025)；由雷達向車前 5 cm、
        # 車後 35 cm、左 15 cm、右 10 cm，換算後如下。
        box_frame: "base_footprint"
        invert: false
        min_x: -0.20
        max_x: 0.20
        min_y: -0.125
        max_y: 0.125
        min_z: -0.50
        max_z: 0.50
