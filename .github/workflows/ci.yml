name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check smart_carrier_robot tests setup.py launch
      - run: pytest -q
