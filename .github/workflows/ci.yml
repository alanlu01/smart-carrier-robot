name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check packages/power_monitor/power_monitor/power_status.py packages/power_monitor/test/test_power_status.py packages/smart_carrier_api/smart_carrier_api packages/smart_carrier_api/tests packages/smart_carrier_api/setup.py packages/smart_carrier_api/launch
      - run: ruff check packages/smart_delivery_core/smart_delivery_core/wheel_handoff.py packages/smart_delivery_core/test/test_wheel_handoff.py packages/smart_delivery_core/test/test_geometry_cache.py

  pure-python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pure policy, persistence, IPC and geometry tests (no ROS imports)
        run: >-
          pytest -q packages/power_monitor/test/test_power_status.py
          packages/smart_carrier_api/tests --ignore=packages/smart_carrier_api/tests/ros
          packages/smart_delivery_core/test/test_wheel_handoff.py
          packages/smart_delivery_core/test/test_geometry_cache.py

  ros-jazzy-tests:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    env:
      ROS_DOMAIN_ID: "231"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_STATIC_PEERS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies in CI only
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pytest python3-serial python3-yaml python3-smbus2 python3-numpy python3-colcon-common-extensions ros-jazzy-nav2-simple-commander ros-jazzy-nav2-bt-navigator ros-jazzy-nav2-mppi-controller ros-jazzy-nav2-rotation-shim-controller ros-jazzy-tf2-ros ros-jazzy-diagnostic-msgs nlohmann-json3-dev
      - name: ROS-dependent functional regression (no robot hardware)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select smart_station_controller smart_delivery_core smart_carrier_api power_monitor hailo_vision --symlink-install --cmake-args -DBUILD_TESTING=ON
          source install/setup.bash
          colcon test --packages-select smart_station_controller --return-code-on-test-failure
          ctest --test-dir build/smart_station_controller --output-on-failure
          python3 tools/run_functional_tests.py
