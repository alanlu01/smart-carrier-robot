name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e packages/power_monitor -e packages/smart_carrier_api
      - run: ruff check packages/power_monitor/power_monitor/power_status.py packages/power_monitor/test/test_power_status.py packages/smart_carrier_api/smart_carrier_api packages/smart_carrier_api/tests packages/smart_carrier_api/setup.py packages/smart_carrier_api/launch
      - run: pytest -q packages/power_monitor/test/test_power_status.py packages/smart_carrier_api/tests
