name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e packages/smart_carrier_robot
      - run: ruff check packages/smart_carrier_robot/smart_carrier_robot packages/smart_carrier_robot/tests packages/smart_carrier_robot/setup.py packages/smart_carrier_robot/launch
      - run: pytest -q packages/smart_carrier_robot/tests
