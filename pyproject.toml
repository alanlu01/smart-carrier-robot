[tool.pytest.ini_options]
testpaths = [
  "packages/power_monitor/test/test_power_status.py",
  "packages/smart_carrier_api/tests",
]
pythonpath = [
  "packages/power_monitor",
  "packages/smart_carrier_api",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
